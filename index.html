<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GSHD Mobil</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top,#ffcc0035,transparent 35%),
    radial-gradient(circle at bottom,#b000003d,transparent 40%),
    #050505;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:430px;
  text-align:center;
}

.logo{
  width:120px;
  height:120px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #ffcc00;
  box-shadow:0 0 30px #ff0000;
  margin-bottom:15px;
}

h1{
  font-size:30px;
  color:#ffcc00;
  text-shadow:0 0 15px red;
}

.sub{
  margin:10px 0 25px;
  color:#ddd;
  font-size:15px;
}

.link{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  margin:14px 0;
  padding:17px;
  border-radius:18px;
  background:linear-gradient(135deg,#ffcc00,#b00000);
  color:white;
  text-decoration:none;
  font-weight:bold;
  font-size:17px;
  box-shadow:0 0 18px #ff000066;
  transition:.2s;
}

.link:hover,
.link:focus{
  transform:scale(1.04);
  outline:3px solid white;
}

.apk{
  background:linear-gradient(135deg,#ffcc00,#ff0000);
}

.telegram{
  background:linear-gradient(135deg,#0088cc,#005f99);
}

.site{
  background:linear-gradient(135deg,#222,#b00000);
}

.note{
  margin-top:25px;
  font-size:13px;
  color:#aaa;
}

.footer{
  margin-top:20px;
  color:#ffcc00;
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">

  <!-- LOGO RESMİNİ BURAYA KOY -->
  <img class="logo" src="https://resmim.net/cdn/2026/05/08/CyZCE3.jpg" alt="GSHD Logo">

  <h1>GSHD Mobil</h1>
  <p class="sub">Galatasaraylıların uygulaması</p>

  <!-- APK LİNKİNİ BURAYA YAZ -->
  <a class="link apk" href="https://gshdapk.github.io/GSHDindir/">
    📲 GSHD Uygulamayı İndir
  </a>

  <!-- TELEGRAM GRUP LİNKİNİ BURAYA YAZ -->
  <a class="link telegram" href="TELEGRAM_LINKINI_BURAYA_YAZ">
    💬 Telegram Grubuna Katıl
  </a>

  <p class="note">
    Android • TV Box • Tablet uyumlu
  </p>

  <div class="footer">
    © GSHD Mobil
  </div>

</div>

</body>
</html>
